<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#0f172a; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="500" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">ReSource AI — System Architecture Blueprint</text>
  <text x="500" y="70" text-anchor="middle" fill="#94a3b8" font-size="14">AI-Powered Waste-to-Resource Circular Economy Platform</text>

  <!-- Tier 1: Client Layer -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="260" height="480" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="2"/>
    <rect x="50" y="110" width="260" height="42" rx="12" fill="#1e3a8a"/>
    <text x="180" y="137" text-anchor="middle" fill="#bfdbfe" font-size="15" font-weight="bold">CLIENT TIER (Vite + React)</text>
    
    <!-- Sub-boxes -->
    <rect x="70" y="170" width="220" height="60" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="180" y="195" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Tailwind CSS Design System</text>
    <text x="180" y="215" text-anchor="middle" fill="#94a3b8" font-size="11">Responsive, A11y, Dark/Light Mode</text>

    <rect x="70" y="245" width="220" height="70" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="180" y="270" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">AuthContext &amp; State Guard</text>
    <text x="180" y="290" text-anchor="middle" fill="#94a3b8" font-size="11">JWT Token in LocalStorage</text>
    <text x="180" y="305" text-anchor="middle" fill="#94a3b8" font-size="11">Role-Based Route Protection</text>

    <rect x="70" y="330" width="220" height="70" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="180" y="355" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Marketplace Views</text>
    <text x="180" y="375" text-anchor="middle" fill="#94a3b8" font-size="11">Browse, Search, Filter Grid</text>
    <text x="180" y="390" text-anchor="middle" fill="#94a3b8" font-size="11">Create / Manage Listings</text>

    <rect x="70" y="415" width="220" height="75" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="180" y="440" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Recommendation UI</text>
    <text x="180" y="460" text-anchor="middle" fill="#94a3b8" font-size="11">Explainable Reason Badges</text>
    <text x="180" y="475" text-anchor="middle" fill="#94a3b8" font-size="11">Confidence Match Score (0-100)</text>

    <rect x="70" y="505" width="220" height="60" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="180" y="530" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Axios API Client</text>
    <text x="180" y="550" text-anchor="middle" fill="#94a3b8" font-size="11">Bearer Interceptor &amp; Error Trap</text>
  </g>

  <!-- Tier 2: Server API Layer -->
  <g filter="url(#shadow)">
    <rect x="370" y="110" width="270" height="480" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
    <rect x="370" y="110" width="270" height="42" rx="12" fill="#065f46"/>
    <text x="505" y="137" text-anchor="middle" fill="#a7f3d0" font-size="15" font-weight="bold">APPLICATION TIER (Express API)</text>

    <!-- Sub-boxes -->
    <rect x="390" y="170" width="230" height="60" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="505" y="195" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Middleware Pipeline</text>
    <text x="505" y="215" text-anchor="middle" fill="#94a3b8" font-size="11">CORS, JSON Parser, JWT Verification</text>

    <rect x="390" y="245" width="230" height="65" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="505" y="270" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Zod Validation Layer</text>
    <text x="505" y="290" text-anchor="middle" fill="#94a3b8" font-size="11">Strict Schema Enforcement</text>

    <rect x="390" y="325" width="230" height="85" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="505" y="350" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Controllers &amp; Services</text>
    <text x="505" y="370" text-anchor="middle" fill="#94a3b8" font-size="11">Auth &amp; bcrypt Hashing</text>
    <text x="505" y="385" text-anchor="middle" fill="#94a3b8" font-size="11">Listings &amp; Interest Management</text>
    <text x="505" y="400" text-anchor="middle" fill="#94a3b8" font-size="11">Cloudinary CDN Upload Service</text>

    <rect x="390" y="425" width="230" height="85" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="505" y="450" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">Baseline Rule-Based Matcher</text>
    <text x="505" y="470" text-anchor="middle" fill="#94a3b8" font-size="11">40pt Cat | 25pt City | 20pt KW | 15pt Age</text>
    <text x="505" y="485" text-anchor="middle" fill="#94a3b8" font-size="11">Deterministic Reason Generator</text>
    <text x="505" y="500" text-anchor="middle" fill="#fbbf24" font-size="10">Active Fallback if ML Service Offline</text>

    <rect x="390" y="525" width="230" height="50" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="505" y="547" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">Database Connection Pool</text>
    <text x="505" y="562" text-anchor="middle" fill="#94a3b8" font-size="10">node-postgres (pg.Pool)</text>
  </g>

  <!-- Tier 3: Data Tier & ML Tier -->
  <g filter="url(#shadow)">
    <!-- PostgreSQL -->
    <rect x="700" y="110" width="250" height="225" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="700" y="110" width="250" height="42" rx="12" fill="#0369a1"/>
    <text x="825" y="137" text-anchor="middle" fill="#bae6fd" font-size="15" font-weight="bold">DATA TIER (PostgreSQL)</text>
    
    <text x="720" y="180" fill="#e2e8f0" font-size="12" font-weight="bold">• users table (UUID, Auth, City, Preferences)</text>
    <text x="720" y="205" fill="#e2e8f0" font-size="12" font-weight="bold">• listings table (Category, Image, Status)</text>
    <text x="720" y="230" fill="#e2e8f0" font-size="12" font-weight="bold">• interests table (Requester, Message)</text>
    <text x="720" y="255" fill="#e2e8f0" font-size="12" font-weight="bold">• match_results table (Cache &amp; Auditing)</text>
    <text x="720" y="285" fill="#94a3b8" font-size="11">ACID Guarantees &amp; Foreign Key Cascades</text>
    <text x="720" y="305" fill="#94a3b8" font-size="11">B-Tree Indexes on Status, City, Category</text>

    <!-- ML Microservice -->
    <rect x="700" y="365" width="250" height="225" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="700" y="365" width="250" height="42" rx="12" fill="#78350f"/>
    <text x="825" y="392" text-anchor="middle" fill="#fde68a" font-size="15" font-weight="bold">ML TIER (Python / scikit-learn)</text>

    <text x="720" y="435" fill="#e2e8f0" font-size="12" font-weight="bold">• FastAPI / Python Service (:8000)</text>
    <text x="720" y="460" fill="#e2e8f0" font-size="12" font-weight="bold">• TfidfVectorizer (Text Tokenization)</text>
    <text x="720" y="485" fill="#e2e8f0" font-size="12" font-weight="bold">• Cosine Similarity Matrix</text>
    <text x="720" y="510" fill="#e2e8f0" font-size="12" font-weight="bold">• Content-Based Ranking Endpoint</text>
    <text x="720" y="540" fill="#94a3b8" font-size="11">Inputs: Listings + Recipient Profile</text>
    <text x="720" y="560" fill="#94a3b8" font-size="11">Outputs: Similarity Ranking &amp; Vector Scores</text>
  </g>

  <!-- Connecting Arrows -->
  <line x1="310" y1="280" x2="370" y2="280" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="340" y="270" text-anchor="middle" fill="#93c5fd" font-size="11">HTTP</text>

  <line x1="370" y1="310" x2="310" y2="310" stroke="#60a5fa" stroke-width="3" stroke-dasharray="4"/>
  <text x="340" y="330" text-anchor="middle" fill="#93c5fd" font-size="11">JSON</text>

  <line x1="640" y1="220" x2="700" y2="220" stroke="#38bdf8" stroke-width="3"/>
  <text x="670" y="210" text-anchor="middle" fill="#7dd3fc" font-size="11">SQL</text>

  <line x1="640" y1="475" x2="700" y2="475" stroke="#f59e0b" stroke-width="3"/>
  <text x="670" y="465" text-anchor="middle" fill="#fcd34d" font-size="11">REST</text>
</svg>
