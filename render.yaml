services:
  # Node.js + Express Backend Web Service
  - type: web
    name: resource-ai-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm run db:migrate && npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: resource-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: MATCHER_SERVICE_URL
        value: http://resource-ai-matcher:8000
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # Optional Python Matcher Microservice
  - type: web
    name: resource-ai-matcher
    env: python
    rootDir: matcher
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port 8000
    plan: free
    envVars:
      - key: PORT
        value: 8000

databases:
  # Managed PostgreSQL Database
  - name: resource-ai-db
    databaseName: resource_ai
    user: resource_ai_user
    plan: free
